<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me? ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- QUESTION PAGE -->

    <div id="questionPage" class="page">

        <div class="card">

            <div class="heart">❤️</div>

            <h1>Do You Love Me?</h1>

            <p>Be honest... I already know the answer ❤️</p>

            <div class="buttons">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="noBtn">
                    No 😢
                </button>

            </div>

            <div id="message"></div>

        </div>

    </div>


    <!-- FLOWER PAGE -->

    <div id="flowerPage" class="page flowerPage">

        <div class="flowerContent">

            <div class="bigHeart">💖</div>

            <h1>Yay! I Knew It! 🥰</h1>

            <p>You just made my heart bloom! 🌸</p>

            <div class="flowers">

                🌹 🌷 🌸 🌺 🌻 🌷 🌹

            </div>

            <p class="loveMessage">
                These flowers are for you ❤️<br>
                Because you deserve all the beautiful things in the world.
            </p>

            <button onclick="goBack()" class="backBtn">
                ❤️ Again
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
