<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me? ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FIRST PAGE -->
    <div id="questionPage">

        <div class="card">

            <div class="topHeart">❤️</div>

            <h1>Do You Love Me?</h1>

            <p>Be honest... I already know the answer ❤️</p>

            <div class="buttonArea">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="noBtn">
                    No 😢
                </button>

            </div>

            <div id="message"></div>

        </div>

    </div>


    <!-- SECOND PAGE -->
    <div id="flowerPage">

        <div class="flowerContent">

            <div class="bigHeart">💖</div>

            <h1>Yay! I Knew It! 🥰</h1>

            <p>You just made my heart bloom! 🌸</p>

            <div class="flowers">
                🌹 🌷 🌸 🌺 🌻 🌷 🌹
            </div>

            <p class="loveText">
                These flowers are for you ❤️<br>
                Because you deserve all the beautiful things in the world.
            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
